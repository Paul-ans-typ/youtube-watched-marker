<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Watched Marker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Watched Marker</h1>
    <p class="subtitle">Marks previously watched videos on YouTube.</p>
  </header>

  <section class="status">
    <span class="count" id="count">0</span>
    <span class="label">watched videos stored</span>
  </section>

  <section class="account">
    <div class="row">
      <span class="row-label">Data belongs to</span>
      <span class="row-value" id="boundLabel" title="">—</span>
    </div>
    <div class="row">
      <span class="row-label">Signed in as</span>
      <span class="row-value" id="currentLabel" title="">—</span>
    </div>

    <fieldset class="scope">
      <legend>Mark watched videos in</legend>
      <label>
        <input type="radio" name="scope" id="scopeSingle" value="single">
        <span>This account only</span>
      </label>
      <label>
        <input type="radio" name="scope" id="scopeAll" value="all">
        <span>All signed-in accounts</span>
      </label>
    </fieldset>
  </section>

  <section class="settings">
    <label class="row switch">
      <span class="row-label">Hide YouTube's watched bar</span>
      <input type="checkbox" id="hideProgress">
    </label>
    <label class="row">
      <span class="row-label">Theme</span>
      <select id="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </section>

  <button type="button" id="openImport" class="primary">Import watch history…</button>
  <button type="button" id="clear" class="danger" disabled>Clear database</button>

  <p class="hint">
    Watched videos get a red <strong>WATCHED</strong> badge on YouTube
    thumbnails, and their thumbnail is dimmed.
  </p>

  <p class="message" id="message" role="status" aria-live="polite"></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
